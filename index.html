<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123a22">
<title>ඩිජිටල් සූදානම | Digital Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@600;800&family=Noto+Sans+Sinhala:wght@400;600&family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.app{max-width:560px;margin:0 auto;display:grid;gap:18px}
.top{display:grid;gap:10px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--paddy));transition:width .35s ease}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
h1{font-family:var(--si);font-size:clamp(30px,8vw,42px);line-height:1.15;margin:8px 0 4px;text-wrap:balance}
h2.q{font-family:var(--si);font-size:clamp(24px,6.5vw,32px);line-height:1.2;margin:4px 0 2px;text-wrap:balance}
.qen{margin:0 0 6px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:grid;gap:2px;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;transition:transform .12s,border-color .15s,background .15s}
.opt:active{transform:scale(.98)}
.opt .s{font-family:var(--si);font-weight:700;font-size:20px;line-height:1.25}
.opt .e{font-size:14px;color:var(--muted)}
.opt.on{border-color:var(--leaf);background:#21603a}
.opt.right{border-color:var(--good);background:#2b6a35}
.opt.wrong{border-color:var(--bad);background:#5a3324}
.opt.multi{grid-template-columns:28px 1fr;align-items:center;column-gap:12px}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:800;color:var(--leaf-ink);grid-row:span 2}
.opt.on .box{background:var(--leaf);border-color:var(--leaf)}
.row{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.row .s{font-family:var(--si);font-weight:700;font-size:18px;line-height:1.25}
.row .e{font-size:13px;color:var(--muted)}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dot{aspect-ratio:1;max-height:52px;border-radius:50%;border:2px solid var(--line);background:transparent;font-weight:800;font-size:17px}
.dot.on{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.feedback{font-weight:700;font-size:18px;min-height:1.4em}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(to top,var(--field-2) 70%,transparent)}
.nav .btn.primary{flex:1}
.center{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:6vh}
.seed{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--paddy),#c98a23);display:grid;place-items:center;font-size:40px;box-shadow:0 0 0 10px rgba(242,181,75,.12)}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:2px}
.tile b{font-size:30px;font-variant-numeric:tabular-nums;color:var(--paddy)}
.tile span{font-size:13px;color:var(--muted)}
.err{background:#5a3324;border:1px solid var(--bad);border-radius:14px;padding:12px 14px}
.fade{animation:in .3s ease both}
@keyframes in{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<script src="questions.js"></script>
<script>
const P = window.POLL, Q = P.questions, app = document.getElementById('app');
const DONE_KEY = 'krushi-poll-done';
const ans = {}; let i = -1, sending = false;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(){ try { return JSON.parse(localStorage.getItem(DONE_KEY)); } catch { return null; } },
                set(v){ try { localStorage.setItem(DONE_KEY, JSON.stringify(v)); } catch {} } };

function intro(){
  const prev = store.get();
  if (prev) return thanks(prev, true);
  app.innerHTML = `<div class="center fade">
    <div class="seed" aria-hidden="true">🌱</div>
    <div class="eyebrow">පූර්ව ඇගයීම · Pre-training check</div>
    <h1>${esc(P.title.si)}</h1><p class="en" style="margin:0">${esc(P.title.en)}</p>
    <p style="margin:6px 0 0">ප්‍රශ්න ${Q.length}යි · විනාඩි 3ක් පමණ<br><span class="en">${Q.length} questions · about 3 minutes · no names collected</span></p>
    <button class="btn primary" id="go" style="width:100%;max-width:340px">ආරම්භ කරන්න · Start</button></div>`;
  document.getElementById('go').onclick = () => go(0);
}

function header(q){
  return `<div class="top"><div class="meta"><span>${esc(q.section[0])} · ${esc(q.section[1])}</span><span>${i+1} / ${Q.length}</span></div>
    <div class="bar"><i style="width:${(i)/Q.length*100}%"></i></div></div>
    <div><h2 class="q">${esc(q.si)}</h2><p class="qen">${esc(q.en)}</p></div>`;
}
const nav = (canNext, label) => `<div class="nav">${i>0?'<button class="btn" id="back">← ආපසු</button>':''}
  <button class="btn primary" id="next" ${canNext?'':'disabled'}>${label || 'ඊළඟ · Next →'}</button></div>`;

function go(n){ i = n; if (i >= Q.length) return submit(); render(); window.scrollTo(0,0); }

function render(){
  const q = Q[i]; let body = '';
  if (q.type === 'single' || q.type === 'quiz') {
    const locked = q.type === 'quiz' && ans[q.id] !== undefined;
    body = `<div class="opts">${order(q).map(k => {
      let cls = 'opt';
      if (ans[q.id] === k) cls += q.type === 'quiz' ? (k === q.correct ? ' right' : ' wrong') : ' on';
      if (locked && k === q.correct) cls += ' right';
      return `<button class="${cls}" data-k="${k}" ${locked?'disabled':''}><span class="s">${esc(q.options[k][0])}</span><span class="e">${esc(q.options[k][1])}</span></button>`;
    }).join('')}</div>`;
    if (q.type === 'quiz') {
      const fb = ans[q.id] === undefined ? '' : ans[q.id] === q.correct
        ? '<div class="feedback good">✓ නිවැරදියි! · Correct!</div>' : '<div class="feedback bad">✗ නිවැරදි පිළිතුර කොළ පාටින් · Right answer in green</div>';
      body += fb + (locked ? nav(true) : '');
    } else body += (ans[q.id] !== undefined ? nav(true) : (i>0 ? nav(false) : ''));
  } else if (q.type === 'multi') {
    const sel = ans[q.id] || [];
    body = `<div class="opts">${q.options.map((o,k) => `<button class="opt multi ${sel.includes(k)?'on':''}" data-k="${k}" aria-pressed="${sel.includes(k)}">
      <span class="box">${sel.includes(k)?'✓':''}</span><span class="s">${esc(o[0])}</span><span class="e">${esc(o[1])}</span></button>`).join('')}</div>` + nav(sel.length > 0);
  } else if (q.type === 'scale') {
    const v = ans[q.id] || Array(q.rows.length).fill(0);
    body = `<div class="opts">${q.rows.map((r,ri) => `<div class="row"><div><div class="s">${esc(r[0])}</div><div class="e">${esc(r[1])}</div></div>
      <div class="dots" role="radiogroup" aria-label="${esc(r[1])}">${[1,2,3,4,5].map(n => `<button class="dot ${v[ri]===n?'on':''}" data-r="${ri}" data-n="${n}" role="radio" aria-checked="${v[ri]===n}">${n}</button>`).join('')}</div>
      <div class="legend"><span>කර නැත · Never</span><span>විශ්වාසයෙන් · Confident</span></div></div>`).join('')}</div>` + nav(v.every(x => x > 0));
  }
  app.innerHTML = `<div class="fade" style="display:grid;gap:16px">${header(q)}${body}</div>`;
  bind(q);
}

// Shuffle quiz options once per person, keep original index as the stored answer.
const orders = {};
function order(q){
  if (q.type !== 'quiz') return q.options.map((_,k) => k);
  if (!orders[q.id]) { const a = q.options.map((_,k) => k); for (let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]];} orders[q.id]=a; }
  return orders[q.id];
}

function bind(q){
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (q.type === 'multi') { const s = new Set(ans[q.id] || []); s.has(k) ? s.delete(k) : s.add(k); ans[q.id] = [...s].sort(); render(); return; }
    ans[q.id] = k; render();
    if (q.type === 'single') setTimeout(() => go(i+1), 260);
  });
  app.querySelectorAll('.dot').forEach(b => b.onclick = () => {
    const v = ans[q.id] || Array(q.rows.length).fill(0); v[+b.dataset.r] = +b.dataset.n; ans[q.id] = v; render();
  });
  const n = document.getElementById('next'), bk = document.getElementById('back');
  if (n) n.onclick = () => go(i+1);
  if (bk) bk.onclick = () => { let j = i-1; if (Q[j] && Q[j].type === 'quiz') { /* quiz answers stay locked */ } go(j); };
}

async function submit(){
  if (sending) return; sending = true;
  app.innerHTML = `<div class="center"><div class="seed">⏳</div><p class="si" style="font-size:22px">යවමින්… <span class="en">Sending…</span></p></div>`;
  try {
    const r = await fetch('/api/submit', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(ans) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Could not save');
    const sc = P.score(ans); store.set(sc); thanks(sc);
  } catch (e) {
    sending = false;
    app.innerHTML = `<div class="center"><div class="err">පිළිතුරු යැවීමට නොහැකි විය. අන්තර්ජාලය පරීක්ෂා කර නැවත උත්සාහ කරන්න.<br><span class="en">Couldn't send your answers. Check your internet and try again. (${esc(e.message)})</span></div>
      <button class="btn primary" id="retry">නැවත යවන්න · Try again</button></div>`;
    document.getElementById('retry').onclick = submit;
  }
}

function thanks(sc, again){
  const lv = P.levels[sc.level];
  app.innerHTML = `<div class="center fade">
    <div class="seed" aria-hidden="true">🌾</div>
    <h1>ස්තූතියි!</h1><p class="en" style="margin:0">${again ? 'You have already answered. Thank you!' : 'Thank you! Your answers are in.'}</p>
    <div class="score">
      <div class="tile"><b>${sc.quiz}/${sc.quizTotal}</b><span>ප්‍රශ්නාවලිය · Quiz</span></div>
      <div class="tile"><b>${sc.readiness}</b><span>සූදානම් ලකුණ · Readiness /100</span></div>
    </div>
    <div class="tile" style="width:100%"><span>ඔබේ මට්ටම · Your level</span><b class="si" style="font-size:26px;color:var(--leaf)">${esc(lv[0])} · ${esc(lv[1])}</b></div>
    <p class="en">තිරය දෙස බලන්න – ප්‍රතිඵල සජීවීව පෙන්වයි.<br>Look at the screen – results are shown live.</p></div>`;
}

intro();
</script>
</body>
</html>
